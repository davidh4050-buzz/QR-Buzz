on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - v0.2.0-local-qr
      - v0.3.0-admin-ux-downloads
      - v0.4.0-analytics-dashboard
      - v0.5.0-dynamic-destinations
      - v0.6.0-qr-types-analytics
      - v0.7.0-campaigns-smart-destinations
      - v0.8.0-design-identity
      - v0.9.0-platform-foundations
      - v0.9.5-hosted-onboarding
      - v0.9.6-workspace-ui
      - v0.9.7-platform-admin
      - v0.9.8-ui-ux-polish
      - v0.9.9-user-assets
      - v0.9.10-signup-onboarding
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Lint PHP syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Linting ${file}"
            if ! lint_output=$(php -l "${file}" 2>&1); then
              echo "${lint_output}"
              echo "::error file=${file}::PHP syntax lint failed; see the log output above."
              exit 1
            fi
            echo "${lint_output}"
          done < <(
            find . \
              -path './vendor' -prune -o \
              -path './build' -prune -o \
              -name '*.php' -print0
          )

      - name: Prune development files from vendor packages
        run: |
          find vendor -type d \( -iname test -o -iname tests -o -iname docs -o -iname doc -o -iname examples -o -iname example \) -prune -exec rm -rf {} +
          find vendor -type f \( -iname '*.md' -o -iname '*.dist' -o -iname 'phpunit.xml*' -o -iname '.php_cs*' -o -iname '.php-cs-fixer*' \) -delete

      - name: Prepare plugin directory
        run: |
          mkdir -p build/qr-buzz
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='.gitignore' \
            --exclude='composer.lock' \
            ./ build/qr-buzz/

      - name: Create ZIP
        run: |
          cd build
          zip -9 -r qr-buzz.zip qr-buzz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr-buzz-wordpress-plugin
          path: build/qr-buzz.zip

      - name: Attach ZIP to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/qr-buzz.zip
